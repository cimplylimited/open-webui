map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

upstream openwebui_upstream {
  server open-webui:8080;
}

server {
  listen 3080;
  server_name _;
  server_tokens off;
  limit_req_status 429;

  # Compress large chat/API payloads over Tailscale before the browser parses them.
  gzip on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript application/wasm text/css text/javascript text/plain;

  # CSP enforcing. style-src 'unsafe-inline' is temporary — Open WebUI uses runtime inline styles.
  # script-src hashes cover 3 inline scripts in build/index.html (resizeIframe, theme FOUC, SvelteKit init).
  # After each docker rebuild, run scripts/update_csp_hashes.sh to recompute the SvelteKit init hash.
  # script-src must NOT include 'unsafe-inline' or 'unsafe-eval'; any such violation requires code changes.

  # Proxy health endpoint: healthy only when upstream API responds.
  location = /healthz {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://openwebui_upstream/api/version;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://dgx-spark.taila99bf1.ts.net https://dgx-spark.taila99bf1.ts.net; img-src 'self' data: blob: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'sha256-IwbGmoRaOLT2V3cavVXQBCapN9X3Jy2mX1vd0rYDIHI=' 'sha256-QUefXgP0z7Kvp4pvQWrCwAcs1QkMEqQzj6p4HHqoA48=' 'sha256-aLXJ/Q2SSp46tDd/XdLsaEFRYhD4dh+Q6BzHeTz0Wqg='; frame-ancestors 'none'" always;
  }

  location ^~ /api/v1/auths/ {
    limit_req zone=auth_limit burst=5;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://openwebui_upstream;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://dgx-spark.taila99bf1.ts.net https://dgx-spark.taila99bf1.ts.net; img-src 'self' data: blob: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'sha256-IwbGmoRaOLT2V3cavVXQBCapN9X3Jy2mX1vd0rYDIHI=' 'sha256-QUefXgP0z7Kvp4pvQWrCwAcs1QkMEqQzj6p4HHqoA48=' 'sha256-aLXJ/Q2SSp46tDd/XdLsaEFRYhD4dh+Q6BzHeTz0Wqg='; frame-ancestors 'none'" always;
  }

  location ^~ /api/ {
    limit_req zone=api_limit burst=120 nodelay;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://openwebui_upstream;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://dgx-spark.taila99bf1.ts.net https://dgx-spark.taila99bf1.ts.net; img-src 'self' data: blob: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'sha256-IwbGmoRaOLT2V3cavVXQBCapN9X3Jy2mX1vd0rYDIHI=' 'sha256-QUefXgP0z7Kvp4pvQWrCwAcs1QkMEqQzj6p4HHqoA48=' 'sha256-aLXJ/Q2SSp46tDd/XdLsaEFRYhD4dh+Q6BzHeTz0Wqg='; frame-ancestors 'none'" always;
  }

  # Static immutable chunks should be long-lived.
  location ^~ /_app/immutable/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://openwebui_upstream;
    add_header Cache-Control "public,max-age=31536000,immutable" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://dgx-spark.taila99bf1.ts.net https://dgx-spark.taila99bf1.ts.net; img-src 'self' data: blob: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'sha256-IwbGmoRaOLT2V3cavVXQBCapN9X3Jy2mX1vd0rYDIHI=' 'sha256-QUefXgP0z7Kvp4pvQWrCwAcs1QkMEqQzj6p4HHqoA48=' 'sha256-aLXJ/Q2SSp46tDd/XdLsaEFRYhD4dh+Q6BzHeTz0Wqg='; frame-ancestors 'none'" always;
  }

  # HTML shell routes should never be cached by browsers.
  location / {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://openwebui_upstream;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://dgx-spark.taila99bf1.ts.net https://dgx-spark.taila99bf1.ts.net; img-src 'self' data: blob: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self' 'sha256-IwbGmoRaOLT2V3cavVXQBCapN9X3Jy2mX1vd0rYDIHI=' 'sha256-QUefXgP0z7Kvp4pvQWrCwAcs1QkMEqQzj6p4HHqoA48=' 'sha256-aLXJ/Q2SSp46tDd/XdLsaEFRYhD4dh+Q6BzHeTz0Wqg='; frame-ancestors 'none'" always;
  }
}
