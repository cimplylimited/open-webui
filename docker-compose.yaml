services:
  ollama:
    image: ollama/ollama@sha256:a6149234667efc71d37766d61c1a16f24c33e4cd7a0bf4125c44a7e47e2419c4
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    tty: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 32g
    cpus: "8.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - internal
    restart: unless-stopped

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_HASH: ${BUILD_HASH-dev-build}
    image: open-webui-local:${WEBUI_DOCKER_TAG-latest}
    container_name: open-webui
    env_file:
      - /home/cimply/.config/open-webui/open-webui.env
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      - ollama
    environment:
      - 'OLLAMA_BASE_URL=http://ollama:11434'
      - 'WEBUI_URL=https://dgx-spark.taila99bf1.ts.net'
      - 'CORS_ALLOW_ORIGIN=https://dgx-spark.taila99bf1.ts.net'
      - 'WEBUI_AUTH=true'
      - 'ENABLE_SIGNUP=false'
    extra_hosts:
      - host.docker.internal:host-gateway
    security_opt:
      - no-new-privileges:true
    mem_limit: 8g
    cpus: "4.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"
    networks:
      - edge
      - internal
      - gateway
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/version', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  webui-edge-proxy:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    container_name: webui-edge-proxy
    depends_on:
      open-webui:
        condition: service_healthy
    ports:
      - "127.0.0.1:3080:3080"
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "10"
    networks:
      - edge
    volumes:
      - ./nginx.tailscale.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  ollama: {}
  open-webui: {}

networks:
  edge: {}
  internal:
    internal: true
  gateway:
    external: true
    name: open-webui_default
